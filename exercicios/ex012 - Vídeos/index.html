<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos com HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente</h1>
    <p>Este vídeo está hospedado no meu próprio servidor</p>
    <video width="600" controls muted autoplay>
        <source src="midias/video_lua.mp4" type="video/mp4">
        <source src="midias/vide_lua.webm" type="video/webm">
        <source src="midias/video_lua.m4v" type="video/mp4">
        <source src="midias/video_lua.ogv" type="video/ogg">
        <p>Seu navegador não tem compatilidade com o vídeo.</p>
    </video>
    <h1>Inserindo Vídeos do Youtube</h1>
    <iframe width="560" height="315"
    src="https://www.youtube.com/embed/D-UmfqFjpl0?si=mfGPJc3GV1asNyGl" title="YouTube video player"
    frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</html>
