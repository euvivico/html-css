<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio da Imagem</title>
</head>
<body>
    <h1>Imagens Flexíveis</h1>
    <p>Não consegue ver a imagem completa? tente diminuir ou ampliar o tamanho do seu navegador!</p>
    <picture>
    <source media="(max-width: 760px)" srcset="imagens/paisagem-p.png" type="image/png">
    <source media="(max-width: 1220px)" srcset="imagens/paisagem-m.png" type="image/png">
    <img src="imagens/paisagem-g.png" alt="Paisagem grande">
    </picture>
</body>
</html>
